spring.application.name=kubelearn-api

# ── KubeLearn ───────────────────────────────────────────────────────────────
# Origin the browser sees. Sign-in links and redirects point here.
kubelearn.public-url=${PUBLIC_URL:http://localhost:5180}
kubelearn.mail-from=${MAIL_FROM:KubeLearn <no-reply@kubelearn.local>}
kubelearn.magic-link-ttl=10m
# Optional: GitHub sign-in is enabled when both are set.
kubelearn.github.client-id=${GITHUB_CLIENT_ID:}
kubelearn.github.client-secret=${GITHUB_CLIENT_SECRET:}

# ── Web ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# trust X-Forwarded-* only from internal proxies (Tomcat RemoteIpValve defaults)
server.forward-headers-strategy=native
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# ── Sessions (stored in Postgres; schema owned by Flyway) ──────────────────
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d
server.servlet.session.timeout=30d
server.servlet.session.cookie.name=kl_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ── Mail (Mailpit locally) ─────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}

# ── Database ────────────────────────────────────────────────────────────────
# Locally, spring-boot-docker-compose starts compose.yaml and wires the datasource.
# In production set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.docker.compose.lifecycle-management=start-only

# ── Ops ─────────────────────────────────────────────────────────────────────
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
