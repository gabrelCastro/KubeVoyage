name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web + shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test -w @kubelearn/shared
      - run: npm run test -w @kubelearn/web
      - run: npm run lint -w @kubelearn/web
      - run: npm run build -w @kubelearn/web
      # the code worker must come out under the name deploy/Caddyfile gives its own CSP
      - run: npm run check:build -w @kubelearn/web

  e2e:
    name: End-to-end (browser)
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @kubelearn/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  accounts:
    name: Accounts (browser + API)
    needs: [web, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # starts the API, which starts Postgres and Mailpit (apps/api/compose.yaml) on the runner's Docker
      - run: npm run e2e:account -w @kubelearn/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-accounts
          path: apps/web/test-results
          retention-days: 7

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers uses the runner's Docker for Postgres
      - run: ./mvnw -B -q test
        working-directory: apps/api

  images:
    name: Docker images
    needs: [web, api, e2e, accounts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
